aid: machina-labs
name: Machina Labs
description: >-
  Machina Labs is a Chatsworth, California manufacturer that builds software-defined
  factories for metal structures. Its RoboCraftsman platform pairs 7-axis robots with
  closed-loop AI control to roboform, scan, trim, drill and finish large sheet-metal
  parts — up to 12 ft long and 1/4 in thick, in aluminum, steel, stainless, titanium,
  nickel superalloys and refractory alloys — without any custom tooling, and captures
  high-resolution process data as a digital twin of every part. The company serves
  aerospace, defense (through its Machina Bellator subsidiary), hypersonics and
  automotive customers, is ITAR registered and CMMC Level 2 certified, and publishes
  customer-facing CAD and Roboforming documentation at docs.machinalabs.ai. It does
  not operate a public developer program: no API reference, OpenAPI specification, SDK
  or developer portal is published, and integration into customer PLM/MES systems is
  described only as a capability sold through its sales and applications engineering
  teams.
